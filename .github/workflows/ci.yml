name: ORVEX quality checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "backend/**"
      - "frontend/**"
      - "PHASE-1-CHECKLIST.md"
      - "PHASE-1-TECHNICAL-PLAN.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  backend:
    name: Backend build and typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orvex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orvex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orvex_test?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npx prisma validate
      - run: test -s prisma/migrations/20261128000000_initial/migration.sql

name: ORVEX quality checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "backend/**"
      - "frontend/**"
      - "PHASE-1-CHECKLIST.md"
      - "PHASE-1-TECHNICAL-PLAN.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orvex-quality-main
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  backend:
    name: Backend build and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

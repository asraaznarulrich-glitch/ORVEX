name: ORVEX dependency verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-lockfiles.yml"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/prisma/schema.prisma"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orvex-dependency-verification
  cancel-in-progress: true

jobs:
  dependencies:
    name: Verify locked dependencies and database schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify frontend lockfile and dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm test

      - name: Verify backend lockfile and dependencies
        working-directory: backend
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm test

      - name: Verify Prisma schema and migration
        working-directory: backend
        run: |
          npx prisma validate
          test -s prisma/migrations/20261128000000_initial/migration.sql
          test -s prisma/migrations/migration_lock.toml

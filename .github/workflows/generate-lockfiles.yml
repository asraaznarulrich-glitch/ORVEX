name: ORVEX lockfile maintenance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-lockfiles.yml"
      - "backend/package.json"
      - "frontend/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orvex-lockfile-maintenance
  cancel-in-progress: false

jobs:
  lockfiles:
    name: Regenerate npm lockfiles without executing package scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # This job intentionally does not run npm ci, builds or tests.
      # --ignore-scripts prevents lifecycle scripts from executing while
      # the write-scoped GitHub token is available.
      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Regenerate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already up to date."
          else
            git commit -m "Update npm dependency lockfiles"
            git pull --rebase origin main
            git push
          fi

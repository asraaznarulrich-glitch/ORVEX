name: Generate and verify npm lockfiles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-lockfiles.yml"
      - "backend/package.json"
      - "frontend/package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfiles:
    name: Generate lockfiles and verify clean installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already up to date."
          else
            git commit -m "Add reproducible npm lockfiles"
            git push
          fi

      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Install backend from lockfile
        working-directory: backend
        run: npm ci

      - name: Verify backend
        working-directory: backend
        run: |
          npm run typecheck
          npm run build
          npm test
